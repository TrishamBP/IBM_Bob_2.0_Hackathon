[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the IBM Bob hackathon project"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real Fireworks API (opt-in: pytest -m live)"]
